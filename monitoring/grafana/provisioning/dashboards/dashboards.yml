# Grafana Dashboard Provisioning
# ===============================

apiVersion: 1

providers:
  - name: 'Memory Palace'
    orgId: 1
    folder: 'Memory Palace'
    folderUid: 'memory-palace'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
