# Prometheus Configuration for Memory Palace
# ===========================================

global:
  scrape_interval: 15s          # How often to scrape targets
  evaluation_interval: 15s      # How often to evaluate rules
  scrape_timeout: 10s           # Timeout for scrape requests

  # Attach these labels to any time series or alerts when communicating
  # with external systems (federation, remote storage, Alertmanager).
  external_labels:
    environment: 'production'
    service: 'memory-palace'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rule files to load
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configuration
scrape_configs:
  # =========================================================================
  # Prometheus self-monitoring
  # =========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # =========================================================================
  # Memory Palace REST API
  # =========================================================================
  - job_name: 'memory-palace-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'memory-palace-api'

  # =========================================================================
  # Memory Palace MCP Server (HTTP transport)
  # =========================================================================
  - job_name: 'memory-palace-mcp'
    static_configs:
      - targets: ['memory-palace:8765']
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'memory-palace-mcp'

  # =========================================================================
  # LibreChat API
  # =========================================================================
  - job_name: 'librechat-api'
    static_configs:
      - targets: ['api:3080']
    metrics_path: /api/metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'librechat'

  # =========================================================================
  # MongoDB Exporter
  # =========================================================================
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    scrape_interval: 30s

  # =========================================================================
  # Redis Exporter
  # =========================================================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # =========================================================================
  # Node Exporter (system metrics)
  # =========================================================================
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # =========================================================================
  # cAdvisor (container metrics)
  # =========================================================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
