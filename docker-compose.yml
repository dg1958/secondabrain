version: '3.8'

# =============================================================================
# LibreChat + Memory Palace MCP Server + Monitoring Stack
# =============================================================================
# This Docker Compose setup provides:
# - LibreChat web UI (ChatGPT-style interface)
# - MongoDB for conversation persistence
# - Redis for caching (optional but recommended)
# - Memory Palace MCP integration
# - Prometheus metrics collection
# - Grafana dashboards
# - AlertManager for alerting
# - Exporters for MongoDB, Redis, and system metrics
# =============================================================================

services:
  # ===========================================================================
  # LibreChat API Server
  # ===========================================================================
  api:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: librechat-api
    restart: unless-stopped
    ports:
      - "${PORT:-3080}:3080"
    depends_on:
      - mongodb
      - rag_api
    volumes:
      # Configuration files
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./config:/app/config:ro

      # Persistent data
      - ./data/uploads:/app/client/public/images
      - ./data/logs:/app/api/logs

      # Memory Palace MCP server mount (update path as needed)
      - ${MEMORY_PALACE_PATH:-./memory_palace}:/app/memory_palace:ro

      # Memory Palace data directory
      - ${MEMORY_PALACE_DATA:-./data/memory_palace}:/app/memory_palace_data
    environment:
      # Core settings from .env
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-3080}
      - NODE_ENV=${NODE_ENV:-production}

      # MongoDB connection
      - MONGO_URI=mongodb://mongodb:27017/LibreChat

      # Redis connection
      - REDIS_URI=redis://redis:6379

      # Security keys (MUST be set in .env)
      - CREDS_KEY=${CREDS_KEY}
      - CREDS_IV=${CREDS_IV}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}

      # Anthropic API
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODELS=${ANTHROPIC_MODELS:-claude-sonnet-4-20250514,claude-opus-4-0-20250514}

      # RAG API for vector search
      - RAG_API_URL=http://rag_api:8000

      # Memory Palace environment
      - MEMORY_PALACE_DATA=/app/memory_palace_data
      - PYTHONPATH=/app/memory_palace

      # Optional: Disable other providers
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_KEY=${GOOGLE_KEY:-}
      - AZURE_API_KEY=${AZURE_API_KEY:-}

      # Debug mode
      - DEBUG_LOGGING=${DEBUG_LOGGING:-false}
      - DEBUG_CONSOLE=${DEBUG_CONSOLE:-false}
    extra_hosts:
      # Allow container to reach host services
      - "host.docker.internal:host-gateway"
    networks:
      - librechat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # MongoDB Database
  # ===========================================================================
  mongodb:
    image: mongo:7.0
    container_name: librechat-mongodb
    restart: unless-stopped
    volumes:
      - ./data/mongodb:/data/db
    environment:
      - MONGO_INITDB_DATABASE=LibreChat
    networks:
      - librechat-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===========================================================================
  # Redis Cache (Optional but Recommended)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: librechat-redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - librechat-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # RAG API (Vector Search Service)
  # ===========================================================================
  rag_api:
    image: ghcr.io/danny-avila/librechat-rag-api-dev-lite:latest
    container_name: librechat-rag-api
    restart: unless-stopped
    environment:
      - RAG_PORT=8000
      - COLLECTION_NAME=librechat
      - EMBEDDINGS_PROVIDER=${RAG_EMBEDDINGS_PROVIDER:-huggingface}
      - HF_TOKEN=${HF_TOKEN:-}
      - CHUNK_SIZE=${RAG_CHUNK_SIZE:-1500}
      - CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-100}
    volumes:
      - ./data/rag:/app/data
    networks:
      - librechat-network

  # ===========================================================================
  # Memory Palace API Server (with metrics endpoint)
  # ===========================================================================
  memory-palace:
    build:
      context: ./memory_palace
      dockerfile: Dockerfile
    container_name: memory-palace-server
    restart: unless-stopped
    ports:
      - "${MEMORY_PALACE_API_PORT:-8000}:8000"
      - "${MEMORY_PALACE_MCP_PORT:-8765}:8765"
    volumes:
      - ${MEMORY_PALACE_DATA:-./data/memory_palace}:/app/data
    environment:
      - MEMORY_PALACE_PORT=8000
      - MEMORY_PALACE_MCP_PORT=8765
      - MEMORY_PALACE_DATA=/app/data
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - METRICS_ENABLED=true
    networks:
      - librechat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # MONITORING STACK
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - librechat-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Grafana - Visualization & Dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      # Anonymous access for read-only dashboards (optional)
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus
    networks:
      - librechat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # AlertManager - Alert Management
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
      - '--cluster.listen-address='
    networks:
      - librechat-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # MongoDB Exporter - MongoDB Metrics
  # ---------------------------------------------------------------------------
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter
    restart: unless-stopped
    ports:
      - "9216:9216"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb
    networks:
      - librechat-network
    command:
      - '--mongodb.uri=mongodb://mongodb:27017'
      - '--collect-all'

  # ---------------------------------------------------------------------------
  # Redis Exporter - Redis Metrics
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - librechat-network

  # ---------------------------------------------------------------------------
  # Node Exporter - System Metrics
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - librechat-network

  # ---------------------------------------------------------------------------
  # cAdvisor - Container Metrics
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - librechat-network

# =============================================================================
# Networks
# =============================================================================
networks:
  librechat-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
